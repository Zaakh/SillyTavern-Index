# Keeps docs/data/extensions.json current: weekly refresh, monthly discovery, refresh on every relevant push.
# Tests gate the update; data is committed only when it changed; the site is deployed from the same run. See README.md.
name: update

on:
  schedule:
    - cron: '17 4 * * 1'   # weekly refresh (Monday)
    - cron: '43 4 1 * *'   # monthly discovery (1st)
  workflow_dispatch:
    inputs:
      mode:
        description: refresh or discover
        type: choice
        options: [refresh, discover]
        default: refresh
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', 'package*.json', '.github/workflows/update.yml']

concurrency:
  group: index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # discovery takes about 11 minutes
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_MODE: ${{ inputs.mode }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - name: Log GraphQL rate limit
        run: gh api graphql -f query='{ rateLimit { limit remaining resetAt } }' --jq .data.rateLimit
      - run: node --test
      - name: Update data
        run: |
          mode="${INPUT_MODE:-refresh}"
          if [ "$SCHEDULE" = "43 4 1 * *" ]; then mode=discover; fi
          node scripts/update.mjs "$mode"
      - name: Commit data if changed
        run: |
          if git diff --quiet -- docs/data/extensions.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/extensions.json
          git commit -m "chore: update extension data"
          git push || { git pull --rebase && git push; }
      # Last step on purpose: it publishes the working tree after the data commit, so the site shows this run's data.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
